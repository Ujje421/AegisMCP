[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aegismcp-ujje421"
version = "0.1.3"
description = "AegisMCP: The opinionated Model Context Protocol framework"
authors = [
    { name = "Ujjwal Jagtap", email = "ujjwaljagtap7@gmail.com" }
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = [
    "pydantic>=2.6",
    "anyio>=4.3",
    "click>=8.1",
]

[project.optional-dependencies]
http       = ["httpx>=0.27", "starlette>=0.37", "uvicorn>=0.29", "websockets>=12.0"]
observability = ["opentelemetry-sdk>=1.24", "opentelemetry-exporter-otlp>=1.24"]
jwt        = ["python-jose[cryptography]>=3.3"]
redis      = ["redis>=5.0"]
pgvector   = ["asyncpg>=0.29", "pgvector>=0.2"]
agents     = ["anthropic>=0.25", "openai>=1.30", "tiktoken>=0.7"]
all        = ["aegismcp-ujje421[http,observability,jwt,redis,agents]"]

[tool.hatch.build.targets.wheel]
packages = ["aegismcp"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "N"]
ignore = []

[tool.mypy]
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --cov=aegismcp --cov-report=term-missing"
testpaths = [
    "tests",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
